name: CI

# Any branch: a solo repo pushes straight to main, and a feature branch should
# still be checked before it gets there.
on: push

# A new push supersedes the previous run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the Dockerfile; the dev machine runs 3.14, so this is the
          # version that actually needs covering.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: python -m pytest -q

  frontend:
    name: frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # `npm run build` is tsc --noEmit followed by vite build.
      - run: npm run build

  docker:
    name: docker image + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t sparschwein:ci .

      # The image build and startup are what broke twice in real deployment
      # (unparsable FAMILY_CHAT_ID, silenced logs), so CI starts it for real.
      - name: Start container
        run: |
          docker run -d --name app -p 8000:8000 \
            -e RUN_BOT=false \
            -e DEV_MODE=false \
            -e FAMILY_CHAT_ID= \
            sparschwein:ci

      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo " — поднялся"
              exit 0
            fi
            sleep 2
          done
          echo "контейнер не ответил на /healthz"
          docker logs app
          exit 1

      - name: Migrations applied
        run: docker logs app 2>&1 | grep -q "Running upgrade" || (docker logs app; exit 1)

      - name: Mini App is served from the image
        run: curl -fsS http://127.0.0.1:8000/ | grep -q 'id="root"'

      - name: Unknown paths are 404, not the SPA
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/.env)
          test "$code" = "404" || { echo "/.env вернул $code вместо 404"; exit 1; }

      - name: API requires auth
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/vouchers)
          test "$code" = "401" || { echo "/api/vouchers вернул $code вместо 401"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs app

  deploy:
    name: deploy to VPS
    needs: [backend, frontend, docker]
    # Only main, and never from a fork: secrets must not be reachable from a PR.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "секрет DEPLOY_HOST не задан"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Host key is pinned in the repo (hostname hashed), so no blind TOFU here.
          cp .github/ssh_known_hosts ~/.ssh/known_hosts
          # The key is locked to /root/deploy.sh by a forced command, so whatever
          # we pass is ignored — the server decides what "deploy" means.
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=15 \
            "root@$DEPLOY_HOST" deploy
