name: CI

# Any branch: a solo repo pushes straight to main, and a feature branch should
# still be checked before it gets there. A push checks, and one to dev or main
# publishes an image as well (`:dev`, `:latest`) — it never deploys. Production is
# rolled out by hand from deploy.yml.
on: push

# A new push supersedes the previous run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job says otherwise (docker, to publish the image).
permissions:
  contents: read

# deploy.yml accepts a commit when its run of this workflow concluded "success",
# and a skipped job counts towards that. Keep every job unconditional — a job-level
# `if:` that skipped, say, e2e would let an untested commit through.

jobs:
  backend:
    name: backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the Dockerfile; the dev machine runs 3.14, so this is the
          # version that actually needs covering.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      # Same pins as the image, so CI tests what ships.
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: ruff check app tests
      - run: python -m pytest -q

  frontend:
    name: frontend (tsc + unit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run test:unit
      # `npm run build` is tsc --noEmit followed by vite build.
      - run: npm run build

  deploy-script:
    name: deploy script (dash + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: shellcheck -s sh deploy/deploy.sh
      - run: pip install pytest
      # The server runs deploy.sh with dash, Ubuntu's /bin/sh — and so do these tests,
      # with git, flock, SQLite and the file copies real and Docker stubbed out.
      - run: python -m pytest -q deploy/
        env:
          DEPLOY_TEST_SHELL: dash

  docker:
    name: docker image + smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only this job may write packages, and only to publish the image below.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          # Built for the server, not for the runner: amd64 is asked for by name so a
          # runner of another architecture cannot quietly produce an image that will
          # not start there. The labels travel into the registry with the image: where
          # it comes from, which commit it is, and that it is still MIT.
          docker build \
            --platform=linux/amd64 \
            --label org.opencontainers.image.source="https://github.com/Slothoncrack/Gutschwein" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.licenses="MIT" \
            -t gutschwein:ci .

      # The image build and startup are what broke twice in real deployment
      # (unparsable FAMILY_CHAT_ID, silenced logs), so CI starts it for real.
      - name: Start container
        run: |
          docker run -d --name app -p 8000:8000 \
            -e RUN_BOT=false \
            -e DEV_MODE=false \
            -e FAMILY_CHAT_ID= \
            gutschwein:ci

      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo " — up"
              exit 0
            fi
            sleep 2
          done
          echo "the container never answered /healthz"
          docker logs app
          exit 1

      - name: Migrations applied
        run: docker logs app 2>&1 | grep -q "Running upgrade" || (docker logs app; exit 1)

      - name: Mini App is served from the image
        run: curl -fsS http://127.0.0.1:8000/ | grep -q 'id="root"'

      - name: The demo runs without any configuration
        run: curl -fsS http://127.0.0.1:8000/demo | grep -q 'id="root"'

      - name: Unknown paths are 404, not the SPA
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/.env)
          test "$code" = "404" || { echo "/.env answered $code, expected 404"; exit 1; }

      - name: API requires auth
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/vouchers)
          test "$code" = "401" || { echo "/api/vouchers answered $code, expected 401"; exit 1; }

      - name: The dev header is ignored when DEV_MODE is off
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Dev-User: 1' \
            http://127.0.0.1:8000/api/vouchers)
          test "$code" = "401" || { echo "X-Dev-User was accepted: $code"; exit 1; }

      - name: Schema and its UIs are not published
        run: |
          for path in /openapi.json /docs /redoc /api/auth/dev-token; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$path")
            test "$code" = "404" || { echo "$path answered $code, expected 404"; exit 1; }
          done

      # Published only after the smoke test above has run the thing: whatever is on
      # :dev (or :latest) has answered /healthz, served the app and refused an
      # unauthenticated request at least once.
      #
      # The registry is pushed to with the workflow's own token — `packages: write`
      # on this job is the whole of the grant, so no personal access token is needed.
      # A fork's registry belongs to the fork, which is why the repository is named:
      # this publishes from Slothoncrack/Gutschwein and nothing else. A pull request
      # is out by the same line — the token it gets is read-only anyway, but a gate
      # that says so is one fewer thing to remember.
      - name: Publish to ghcr.io
        if: >-
          github.event_name == 'push' &&
          github.repository == 'Slothoncrack/Gutschwein' &&
          (github.ref == 'refs/heads/dev' ||
           github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v'))
        run: |
          # The build asks for amd64; this refuses to publish anything else, so an
          # image the server cannot run never gets a tag in the first place.
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' gutschwein:ci)
          test "$platform" = "linux/amd64" || { echo "built $platform, not linux/amd64"; exit 1; }

          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          image=ghcr.io/${{ github.repository_owner }}/gutschwein
          # Lowercase: registries reject capitals in a repository name.
          image=$(echo "$image" | tr '[:upper:]' '[:lower:]')

          case "$GITHUB_REF" in
            refs/heads/dev)
              # :dev moves with the branch, and the sha tag is what a rollback needs —
              # "the one from before" by name rather than by rebuilding it.
              docker tag gutschwein:ci "$image:dev"
              docker tag gutschwein:ci "$image:${GITHUB_SHA::12}"
              docker push "$image:dev"
              docker push "$image:${GITHUB_SHA::12}"
              ;;
            refs/heads/main)
              # :latest tracks main.
              docker tag gutschwein:ci "$image:latest"
              docker tag gutschwein:ci "$image:${GITHUB_SHA::12}"
              docker push "$image:latest"
              docker push "$image:${GITHUB_SHA::12}"
              ;;
            *)
              # A release tag gets its own name and deliberately does not move
              # :latest, which belongs to main.
              version=${GITHUB_REF#refs/tags/}
              docker tag gutschwein:ci "$image:$version"
              docker push "$image:$version"
              ;;
          esac

      - name: Container logs
        if: always()
        run: docker logs app

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The suite drives the built bundle served by the real backend, so both
      # halves have to be installed.
      # Same pins as the image, so CI tests what ships.
      - run: pip install -c constraints.txt -e ".[dev]"
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
