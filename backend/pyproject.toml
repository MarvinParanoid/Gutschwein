[project]
name = "gutschwein-backend"
version = "0.1.0"
license = "MIT"
description = "Family voucher manager - FastAPI backend and Telegram bot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "aiogram>=3.13",
    # Uploads are re-encoded to WebP: HEIC from iPhones is otherwise stored fine
    # and then fails to render in the webview.
    "pillow>=10",
    "pillow-heif>=0.16",
    # Reads the barcode out of a card screenshot and redraws it as SVG.
    "zxing-cpp>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
