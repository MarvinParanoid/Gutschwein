services:
  app:
    # Both, on purpose: `docker compose pull` takes the image CI published, and
    # `docker compose up --build` still builds from this checkout — which is what
    # a developer wants, and the only way to deploy work that is not pushed yet.
    # The tag is a variable so a rollback is a tag, not a rebuild: the deploy
    # script passes the commit it was asked for.
    image: ghcr.io/marvinparanoid/gutschwein:${GUTSCHWEIN_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # SQLite database and uploaded images.
      - ./data:/data
    ports:
      # Bound to loopback: a reverse proxy in front terminates TLS.
      - "127.0.0.1:8000:8000"
    logging:
      # Scanners hammer the public URL around the clock; without a cap the log
      # grows until the disk is full.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
